<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art preview v3 – Suuraseikkailu</title>
<!-- Dev tool only (not part of the app build). Serve the project root and open /tools/art-preview.html
     ?only=cover shows the split cover full-screen (its composition follows the viewport orientation). -->
<link rel="stylesheet" href="../node_modules/@fontsource/fredoka/latin-600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/amiri-quran/arabic-400.css">
<style>
  :root{--ink:#24324F}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:Fredoka,system-ui,sans-serif;color:var(--ink);background:#FFF8F1}
  main{max-width:1240px;margin:0 auto;padding:16px}
  h1{font-size:28px;margin:8px 0 4px}
  h2{font-size:17px;margin:0 0 10px;color:#5A6488}
  section{margin:0 0 18px;padding:16px;border-radius:24px;background:#fff;box-shadow:0 8px 24px rgba(36,50,79,.08)}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
  .cell{display:grid;justify-items:center;gap:4px;font-size:11px;color:#6A7394}
  .box>svg{display:block;width:100%;height:100%}
  .girl{background:#FFF1F5}.boy{background:#EEF6FF}
  .icons .ic{display:grid;place-items:center;width:64px;height:64px;border-radius:20px;background:linear-gradient(#FF9DB4,#FF7A9A);color:#fff;box-shadow:0 6px 14px rgba(255,122,154,.35)}
  .icons.boy .ic{background:linear-gradient(#7CC4FF,#5AB4FF);box-shadow:0 6px 14px rgba(90,180,255,.35)}
  .icons .ic .icon{width:32px;height:32px}
  .icons .sm{color:var(--ink);font-size:24px}
  .burst-box{position:relative;width:170px;height:170px;display:grid;place-items:center}
  .burst-box .art{position:absolute;inset:0}
  .burst-box b{position:relative;font-size:30px;color:var(--ink)}
  .bubble-box{position:relative;width:220px;height:160px}
  .bubble-box .art{position:absolute;inset:0}
  .bubble-box b{position:absolute;left:0;right:0;top:50px;text-align:center;font-size:28px}
  .bg{position:relative;height:200px;border-radius:20px;overflow:hidden}
  .bg.girl{background:linear-gradient(#FFE9EF,#FFF8F1)}.bg.boy{background:linear-gradient(#DDEEFF,#F5FAFF)}
  .bg .art{position:absolute;inset:auto 0 0 0;height:170px}
  .bg.phone{width:360px;height:180px}
  .bg.phone .art{height:150px}
  .ar{font-family:'Amiri Quran',serif;font-size:2.2rem;line-height:2.1;direction:rtl;text-align:right;background:#fff;border-radius:22px;padding:8px 18px;box-shadow:0 6px 20px rgba(36,50,79,.08)}
  .mask{border-radius:22%;overflow:hidden}
  .circ{border-radius:50%;overflow:hidden}
  body.only main{display:none}
  #coverOnly{display:none;position:fixed;inset:0}
  body.only #coverOnly{display:block}
  #coverOnly .btn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px 34px;font:600 28px Fredoka,sans-serif;color:#fff;background:linear-gradient(#FF9DB4,#FF7A9A);border-radius:999px;box-shadow:0 10px 24px rgba(255,122,154,.4);white-space:nowrap}
</style>
</head>
<body>
<div id="coverOnly"><div id="coverHost" style="position:absolute;inset:0"></div><div class="btn">Aloita Suuraseikkailu</div></div>
<main id="m"></main>
<script type="module">
import ART from '../src/art.js';

const q = new URLSearchParams(location.search);
if (q.get('only') === 'cover' || q.get('only') === 'intro') {
  document.body.classList.add('only');
  document.getElementById('coverHost').innerHTML = q.get('only') === 'intro' ? ART.intro(q.get('o') || undefined) : ART.cover();
  if (q.get('grey')) document.getElementById('coverHost').style.filter = 'grayscale(1)';
  if (q.get('nobtn')) document.querySelector('#coverOnly .btn').remove();
  window.__artReady = true;
} else {
  const m = document.getElementById('m');
  const box = (html, w, h, label, cls) => '<div class="cell"><div class="box ' + (cls || '') + '" style="width:' + w + 'px;height:' + h + 'px">' + html + '</div>' + (label != null ? '<span>' + label + '</span>' : '') + '</div>';
  const sec = (id, title, body, cls) => '<section id="' + id + '" class="' + (cls || '') + '"><h2>' + title + '</h2>' + body + '</section>';
  let h = '<h1>Suuraseikkailu v3 – soft premium art</h1>';

  const names = ART.ICON_NAMES;
  ['girl', 'boy'].forEach((t) => {
    h += sec('icons-' + t, 'Icons (' + t + ')', '<div class="row icons ' + t + '">' + names.map((n) => '<div class="cell"><div class="ic">' + ART.icon(n) + '</div><span>' + n + '</span></div>').join('') + '</div>' +
      '<div class="row icons" style="margin-top:10px">' + names.map((n) => '<span class="sm">' + ART.icon(n) + '</span>').join('') + '</div>', t);
  });

  h += sec('avatars', 'Avatars', '<div class="row">' + ['girl', 'boy'].map((t) => [140, 88, 56].map((s) => box(ART.avatar(t), s, s, t + ' ' + s)).join('')).join('') + '</div>');

  ['girl', 'boy'].forEach((t) => {
    let r = '';
    for (let d = 0; d <= 18; d++) r += box(ART.progress(t, { total: 18, done: d }), 180, 150, d + '/18');
    h += sec('progress-' + t, 'Progress ' + t + ' (total 18)', '<div class="row">' + r + '</div>', t);
    let r2 = '';
    [[1, 0], [2, 1], [4, 2], [5, 5], [7, 3], [7, 7], [12, 6], [18, 9], [20, 10], [24, 12], [24, 24]].forEach((p) => { r2 += box(ART.progress(t, { total: p[0], done: p[1] }), 240, 200, p[1] + '/' + p[0]); });
    h += sec('progressN-' + t, 'Progress ' + t + ' other totals', '<div class="row">' + r2 + '</div>', t);
    h += sec('progressBig-' + t, 'Progress ' + t + ' big', '<div class="row">' + box(ART.progress(t, { total: 18, done: 11 }), 480, 400, '11/18') + box(ART.progress(t, { total: 18, done: 18 }), 480, 400, '18/18 complete') + '</div>', t);
  });

  ['girl', 'boy'].forEach((t) => {
    let r = '';
    [2, 4, 5, 7].forEach((n) => { for (let k = 0; k <= n; k++) r += box(ART.reward(t, { slots: n, filled: k }), 160, 120, k + '/' + n); });
    h += sec('reward-' + t, 'Reward ' + t, '<div class="row">' + r + '</div>', t);
    h += sec('rewardBig-' + t, 'Reward ' + t + ' big', '<div class="row">' + box(ART.reward(t, { slots: 7, filled: 4 }), 400, 300, '4/7') + box(ART.reward(t, { slots: 4, filled: 4 }), 400, 300, '4/4') + '</div>', t);
  });

  const ids = ['shahada', 'fatiha', 'ikhlas', 'kawthar', 'bonus'];
  h += sec('stickers', 'Stickers', ['girl', 'boy'].map((t) => '<div class="row" style="margin-bottom:10px">' +
    ids.map((i) => box(ART.sticker(t, i, true), 130, 130, t + ' ' + i)).join('') +
    ids.map((i) => box(ART.sticker(t, i, false), 130, 130, 'ghost')).join('') + '</div>').join('') +
    '<div class="row">' + ids.map((i) => box(ART.sticker('girl', i, true), 64, 64, '64')).join('') + ids.map((i) => box(ART.sticker('boy', i, true), 64, 64, '64')).join('') + '</div>');

  h += sec('bursts', 'Praise badge (burst) + bubble', '<div class="row">' +
    [['#FFD36E', 'Hienoa!'], ['#FF7A9A', 'Upeaa!'], ['#B9A4FF', 'Jee!'], ['#8EE3C8', 'Super!'], ['#5AB4FF', 'Hienoa!'], ['#FF9A3C', 'Upeaa!']].map((b) => '<div class="burst-box">' + ART.burst(b[0]) + '<b>' + b[1] + '</b></div>').join('') +
    '<div class="bubble-box">' + ART.bubble() + '<b>Sanoin!</b></div></div>');

  h += sec('levels', 'Level icons', '<div class="row">' + ['easy', 'medium', 'hard'].map((l) => box(ART.levelIcon(l), 150, 90, l)).join('') + ['easy', 'medium', 'hard'].map((l) => box(ART.levelIcon(l), 72, 44, l)).join('') + ['easy', 'medium', 'hard'].map((l) => box(ART.levelIcon(l), 47, 28, '28px')).join('') + '</div>');

  h += sec('backgrounds', 'Backgrounds', '<div class="bg girl">' + ART.background('girl') + '</div><div style="height:10px"></div><div class="bg boy">' + ART.background('boy') + '</div>' +
    '<div class="row" style="margin-top:10px"><div class="bg phone girl">' + ART.background('girl') + '</div><div class="bg phone boy">' + ART.background('boy') + '</div></div>');

  h += sec('ayah', 'Ayah markers (calm)', '<p class="ar">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ' + ART.ayah(1) + '</p><p class="ar" data-theme="boy">ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَٰلَمِينَ' + ART.ayah(2) + ' ' + ART.ayah(12) + ' ' + ART.ayah(123) + '</p>');

  h += sec('motifs', 'Motifs (ART.motif)', '<div class="row">' + ['pony', 'pony-head', 'pony-crown', 'bunny', 'tiara', 'crown', 'castle', 'gem', 'heart', 'car', 'rocket', 'trophy', 'helmet', 'flag'].map((n) => box(ART.motif(n), 100, 100, n) ).join('') + '</div>' +
    '<div class="row">' + ['pony-head', 'bunny', 'car', 'rocket'].map((n) => box(ART.motif(n, '', false), 70, 70, 'ghost')).join('') + '</div>');

  h += sec('appicon', 'App icon', '<div class="row">' + box(ART.appIcon(), 256, 256, 'square') + box(ART.appIcon(), 256, 256, 'rounded', 'mask') + box(ART.appIcon(), 256, 256, 'maskable circle 80%', 'circ') + box(ART.appIcon(), 64, 64, '64') + '</div>');

  h += sec('legacy', 'v2 wrappers', '<div class="row">' + box(ART.crown({ slots: 5, filled: 3 }), 160, 120, 'crown()') + box(ART.palace({ windows: 7, lit: 3 }), 160, 130, 'palace()') +
    box(ART.gem('#8EE3C8'), 60, 60, 'gem()') + box(ART.crystal(), 60, 60, 'crystal()') + box(ART.tiara('#FF7A9A'), 60, 60, 'tiara()') + box(ART.snowflake(), 40, 40, 'snowflake()') + box(ART.sticker('fatiha', true), 80, 80, 'sticker(id,e)') + '</div>');

  m.innerHTML = h;
  window.__artReady = true;
}
</script>
</body>
</html>
