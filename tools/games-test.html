<!doctype html>
<html lang="fi" data-theme="boy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minipelit v3 – testi</title>
<style>
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: #FFF6D6;
    color: #24324F;
    font-family: var(--f-body, system-ui);
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
    box-sizing: border-box;
  }
  html[data-theme="girl"] body { background: #FFF0F8; }
  h1 { font-family: var(--f-display, system-ui); font-weight: 700; font-size: 1.8rem; margin: 0 0 4px; }
  h2 { font: 700 1.1rem/1.2 var(--f-display, system-ui); margin: 18px 0 8px; }
  p { margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; max-width: 760px; }
  .grid button {
    min-height: 64px; padding: 10px 12px; border-radius: 16px; border: 0; box-shadow: 0 6px 16px rgba(36, 50, 79, .14);
    background: #fff; color: #24324F; font: 700 1rem/1.2 var(--f-body, system-ui); cursor: pointer;
  }
  .grid.boy button { background: #DDE8FF; }
  .grid.girl button { background: #FFE0F0; }
  .grid button.fx { background: #FFF2A8; }
  .grid button:active { transform: scale(.97); }
  #log { margin-top: 16px; font-size: .95rem; min-height: 1.4em; white-space: pre-line; }
  label { display: inline-flex; gap: 8px; align-items: center; margin: 0 16px 6px 0; min-height: 44px; }
</style>
</head>
<body>
  <h1>Minipelit v3</h1>
  <p>Jokainen nappi avaa yhden pelin. Peli loppuu itsestään viimeistään noin 20 sekunnissa.</p>
  <label><input type="checkbox" id="snd" checked> Äänet</label>
  <div id="lists"></div>
  <div id="log" aria-live="polite"></div>
  <script type="module">
    import '@fontsource/fredoka/latin-600.css';
    import '@fontsource/fredoka/latin-700.css';
    import '@fontsource/nunito/latin-400.css';
    import '@fontsource/nunito/latin-700.css';
    import '../src/styles/tokens.css';
    import '../src/styles/games.css';
    import MiniGames from '../src/games/index.js';
    import { FX } from '../src/fx.js';
    import { SFX } from '../src/audio/sfx.js';

    const lists = document.getElementById('lists'), log = document.getElementById('log');
    const msg = (t) => { log.textContent = t; };
    const q = new URLSearchParams(location.search);
    if (q.get('theme')) document.documentElement.dataset.theme = q.get('theme');
    document.getElementById('snd').addEventListener('change', (e) => SFX.setEnabled(e.target.checked));

    /* play(theme, i) -> Promise<{ ms, said }> ; used by the buttons and by tools/games-test.cjs */
    function play(theme, i) {
      document.documentElement.dataset.theme = theme;
      return new Promise((resolve) => {
        const t0 = performance.now();
        let said = null, n = 0;
        window.__mgGame = MiniGames.play({
          theme, index: i,
          say: (id) => { said = id; n++; msg('say: ' + id); },
          onDone: () => {
            const ms = performance.now() - t0;
            msg('onDone: ' + theme + ' ' + i + ' valmis (' + (ms / 1000).toFixed(1) + ' s), say = ' + said);
            resolve({ ms, said, sayCount: n });
          }
        });
      });
    }
    window.__mgTest = { MiniGames, FX, SFX, play };

    for (const theme of ['boy', 'girl']) {
      const h = document.createElement('h2');
      h.textContent = theme === 'boy' ? 'Poika' : 'Tyttö';
      lists.appendChild(h);
      const grid = document.createElement('div');
      grid.className = 'grid ' + theme;
      MiniGames.titles(theme).forEach((title, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = i + '. ' + title;
        b.addEventListener('click', () => { SFX.unlock(); play(theme, i); });
        grid.appendChild(b);
      });
      lists.appendChild(grid);
    }
    const fx = document.createElement('div');
    fx.className = 'grid';
    [['FX.confetti()', () => FX.confetti()],
     ['FX.show(5000)', () => FX.show(5000)],
     ['FX.burst()', () => { FX.burst(innerWidth / 2, innerHeight / 2); SFX.pop(); }],
     ['FX.sparkle()', () => { FX.sparkle(innerWidth / 2, innerHeight / 2); SFX.sparkle(); }],
     ['FX.firework()', () => { FX.firework(innerWidth / 2, innerHeight / 3, Math.random() * 360); SFX.boom(); }],
     ['FX.clear()', () => FX.clear()],
     ['teema: poika', () => { document.documentElement.dataset.theme = 'boy'; }],
     ['teema: tyttö', () => { document.documentElement.dataset.theme = 'girl'; }]].forEach((d) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'fx';
      b.textContent = d[0];
      b.addEventListener('click', () => { SFX.unlock(); d[1](); });
      fx.appendChild(b);
    });
    const h = document.createElement('h2');
    h.textContent = 'Efektit';
    lists.appendChild(h);
    lists.appendChild(fx);
    msg('MiniGames.count = ' + MiniGames.count('boy') + ' / ' + MiniGames.count('girl'));
  </script>
</body>
</html>
