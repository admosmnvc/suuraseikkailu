<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Dev tool for the parent settings sheet (not part of the app build).
     Run through the Vite dev server:  npx vite --host 127.0.0.1 --port 5102
     then open http://127.0.0.1:5102/tools/settings-test.html  (node tools/settings-shots.cjs automates it).
     The base points at the site root so relative clip paths (audio/...) resolve like in the app.
     Query flag: ?open=1 opens the sheet at load. -->
<base href="../">
<title>Asetukset – testi</title>
<style>
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    padding: 20px 16px;
    font-family: var(--f-body);
    color: var(--ink);
    background: radial-gradient(120% 60% at 50% -10%, #EDE6FF 0%, transparent 60%), linear-gradient(180deg, var(--snow), var(--frost));
  }
  h1 { margin: 0 0 12px; font-family: var(--f-display); font-size: 1.6rem; }
  #openBtn { min-height: 64px; padding: 0 26px; border: 0; border-radius: 999px; background: var(--sapphire); color: #fff; font: 700 1.1rem var(--f-body); }
  pre { max-width: 100%; overflow: auto; white-space: pre-wrap; font-size: 12px; background: #fff; border-radius: 12px; padding: 10px; box-shadow: inset 0 0 0 1px var(--silver); }
</style>
</head>
<body>
<h1>Suuraseikkailu – asetusten testi</h1>
<button type="button" id="openBtn">Avaa asetukset</button>
<pre id="out"></pre>
<div id="settings" class="overlay overlay-settings" hidden></div>
<script type="module">
  import '/src/styles/tokens.css';
  import '@fontsource/fredoka/latin-600.css';
  import '@fontsource/fredoka/latin-700.css';
  import '@fontsource/nunito/latin-400.css';
  import '@fontsource/nunito/latin-700.css';
  import '@fontsource/amiri-quran/arabic-400.css';
  import DATA from '/src/content/data.js';
  import * as engine from '/src/audio/engine.js';
  import * as settings from '/src/ui/settings.js';

  const q = new URLSearchParams(location.search);
  const state = { progress: { shahada: 1, fatiha: 3, ikhlas: 0, kawthar: 0 }, done: {}, stars: 7, name: 'Amina',
    speech: true, slow: false, translit: true, sfx: true, every: 1, game: 2 };
  const log = [];
  const out = document.getElementById('out');
  const show = () => { out.textContent = JSON.stringify({ state, log: log.slice(-8) }, null, 1); };
  /* the app unlocks audio at its gate; here the first tap anywhere does it */
  document.addEventListener('pointerdown', () => { try { engine.unlock(); } catch (e) { /* ignore */ } }, { capture: true, once: true });

  settings.initSettings({
    root: document.getElementById('settings'),
    state,
    save: () => { log.push('save'); show(); },
    onChange: (k) => { log.push('change:' + k); show(); },
    onReset: () => {
      log.push('reset');
      state.progress = { shahada: 0, fatiha: 0, ikhlas: 0, kawthar: 0 }; state.done = {}; state.stars = 0; state.game = 0;
      show();
    },
    credits: DATA.credits
  });
  document.getElementById('openBtn').addEventListener('click', () => settings.openSettings());
  window.__t = { state, log, settings, engine };
  show();
  if (q.get('open')) settings.openSettings();
</script>
</body>
</html>
