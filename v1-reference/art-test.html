<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ART-testi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Andika:wght@400;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root {
    --night:#141838; --sky-top:#1A2152; --surface:#262A64; --ink:#FFF8EA;
    --gold:#FFC93C; --gold-hi:#FFE08A; --gold-deep:#C98A00; --gold-ink:#3A2600;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #141838; color: #FFF8EA; font-family: "Andika", sans-serif; font-size: 16px; }
  h1 { font-family: "Lilita One", sans-serif; font-weight: 400; font-size: 30px; margin: 0; display: flex; align-items: center; gap: 10px; }
  h1 .emblem { width: 44px; height: 44px; }
  h2 { font-family: "Lilita One", sans-serif; font-weight: 400; font-size: 18px; color: #FFE08A; margin: 22px 0 10px; }
  .pad { padding: 16px; }
  .icons { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .icons.s24 { font-size: 24px; }
  .icons.s40 { font-size: 40px; color: #FFC93C; }
  .chip { display: inline-flex; align-items: center; gap: 8px; background: #FFC93C; color: #3A2600; border-radius: 999px; padding: 8px 16px; font-family: "Lilita One", sans-serif; font-size: 20px; margin: 10px 8px 0 0; }
  .chip.alt { background: #262A64; color: #FFF8EA; }
  .medals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .arabic { font-family: "Amiri Quran", "Amiri", serif; font-size: 34px; line-height: 2; text-align: right; }
  .ayahs { font-size: 34px; display: flex; gap: 10px; }
  .ayahs .ayah { margin: 0; }
  .ayahs.big { font-size: 64px; }
  .skybox { width: 390px; max-width: 100%; height: 110px; background: linear-gradient(#1A2152, #141838); position: relative; }
  .row { display: flex; gap: 20px; align-items: center; }
  .emblem-big { width: 96px; height: 96px; }
  .emblem-big svg { width: 100%; height: 100%; }
  .reward { width: 200px; }
  .patbox { width: 390px; max-width: 100%; height: 300px; background-color: #1A2152; }
</style>
</head>
<body>
<div class="pad">
  <h1 id="title"><span id="hdr-emblem"></span>Suuraseikkailu</h1>

  <h2>Kuvakkeet 24 px</h2>
  <div class="icons s24" id="icons24"></div>
  <h2>Kuvakkeet 40 px</h2>
  <div class="icons s40" id="icons40"></div>
  <div id="chips"></div>

  <h2>Mitalit</h2>
  <div class="medals" id="medals-on"></div>
  <div class="medals" id="medals-off" style="margin-top:8px"></div>

  <h2>Jakeen merkki</h2>
  <p class="arabic" dir="rtl" lang="ar" id="bismillah">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</p>
  <div class="ayahs" id="ayahs" dir="rtl"></div>
  <div class="ayahs big" id="ayahs-big" dir="rtl" style="margin-top:10px"></div>
</div>

<h2 class="pad" style="padding-bottom:0">Siluetti 390 × 110</h2>
<div class="skybox" id="sky"></div>

<div class="pad">
  <h2>Tunnus</h2>
  <div class="row"><div class="emblem-big" id="emblem-big"></div><div id="emblem-small"></div></div>

  <h2>Palkintotähti</h2>
  <div class="reward" id="reward"></div>
</div>

<h2 class="pad" style="padding-bottom:0">Kuvio 390 × 300</h2>
<div class="patbox" id="pat"></div>
<div style="height:24px"></div>

<script src="art.js"></script>
<script>
  (function () {
    var names = ['home', 'play', 'star', 'speech', 'gear', 'close', 'check', 'replay', 'back', 'sound'];
    function $(id) { return document.getElementById(id); }
    $('icons24').innerHTML = names.map(function (n) { return ART.icon(n); }).join('');
    $('icons40').innerHTML = names.map(function (n) { return ART.icon(n); }).join('');
    $('chips').innerHTML =
      '<span class="chip">' + ART.icon('play') + 'Kuuntele</span>' +
      '<span class="chip alt">' + ART.icon('speech') + 'Mitä se tarkoittaa?</span>' +
      '<span class="chip alt">' + ART.icon('sound') + ART.icon('replay') + '</span>';
    var secs = ['shahada', 'fatiha', 'ikhlas', 'kawthar'];
    $('medals-on').innerHTML = secs.map(function (s) { return ART.medal(s, true); }).join('');
    $('medals-off').innerHTML = secs.map(function (s) { return ART.medal(s, false); }).join('');
    $('hdr-emblem').innerHTML = ART.emblem();
    $('bismillah').insertAdjacentHTML('beforeend', ART.ayah(1));
    var ay = '';
    for (var i = 2; i <= 7; i++) ay += ART.ayah(i);
    $('ayahs').innerHTML = ay;
    $('ayahs-big').innerHTML = ART.ayah(1) + ART.ayah(7) + ART.ayah(12) + ART.ayah(99);
    $('sky').innerHTML = ART.skyline();
    $('emblem-big').innerHTML = ART.emblem();
    $('emblem-small').innerHTML = ART.emblem();
    $('reward').innerHTML = ART.rewardStar();
    $('pat').style.backgroundImage = ART.patternURL();
  })();
</script>
</body>
</html>
